<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning & Organisation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Styles personnalisés et animations de transition */
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.6); }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col font-sans transition-colors duration-200">

  <!-- BARRE DE NAVIGATION PRINCIPALE -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-20 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg shadow">
          <i class="fa-solid fa-calendar-days text-xl"></i>
        </div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
          Mon Planning
        </h1>
      </div>

      <nav class="flex items-center space-x-1 sm:space-x-2">
        <button onclick="switchView('dashboard')" id="nav-dashboard" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-white flex items-center gap-2">
          <i class="fa-solid fa-chart-line"></i> <span class="hidden sm:inline">Tableau de bord</span>
        </button>
        <button onclick="switchView('calendar')" id="nav-calendar" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 flex items-center gap-2">
          <i class="fa-solid fa-calendar-week"></i> <span class="hidden sm:inline">Planning</span>
        </button>
        <button onclick="switchView('menu')" id="nav-menu" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-white flex items-center gap-2">
          <i class="fa-solid fa-utensils"></i> <span class="hidden sm:inline">Menus</span>
        </button>
        <button onclick="switchView('shopping')" id="nav-shopping" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-white flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping"></i> <span class="hidden sm:inline">Courses</span>
        </button>
        <button onclick="switchView('tasks')" id="nav-tasks" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-white flex items-center gap-2">
          <i class="fa-solid fa-list-check"></i> <span class="hidden sm:inline">Tâches</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 overflow-y-auto custom-scrollbar">

    <!-- VUE TABLEAU DE BORD -->
    <section id="view-dashboard" class="hidden space-y-6 fade-in">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
          <div class="p-3 bg-indigo-100 text-indigo-600 dark:bg-indigo-900/50 dark:text-indigo-400 rounded-lg">
            <i class="fa-solid fa-calendar-day text-2xl"></i>
          </div>
          <div>
            <p class="text-xs uppercase font-semibold text-slate-400">Aujourd'hui</p>
            <h3 id="dash-today-events" class="text-2xl font-bold text-slate-800 dark:text-slate-100">0 événement</h3>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
          <div class="p-3 bg-emerald-100 text-emerald-600 dark:bg-emerald-900/50 dark:text-emerald-400 rounded-lg">
            <i class="fa-solid fa-check-double text-2xl"></i>
          </div>
          <div>
            <p class="text-xs uppercase font-semibold text-slate-400">Tâches restantes</p>
            <h3 id="dash-pending-tasks" class="text-2xl font-bold text-slate-800 dark:text-slate-100">0 tâche</h3>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-4">
          <div class="p-3 bg-amber-100 text-amber-600 dark:bg-amber-900/50 dark:text-amber-400 rounded-lg">
            <i class="fa-solid fa-cart-shopping text-2xl"></i>
          </div>
          <div>
            <p class="text-xs uppercase font-semibold text-slate-400">Articles à acheter</p>
            <h3 id="dash-shopping-count" class="text-2xl font-bold text-slate-800 dark:text-slate-100">0 article</h3>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-clock text-indigo-500"></i> Prochains événements
          </h3>
          <div id="dash-upcoming-list" class="space-y-3"></div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-utensils text-indigo-500"></i> Repas du jour
          </h3>
          <div id="dash-today-meals" class="space-y-3"></div>
        </div>
      </div>
    </section>

    <!-- VUE PLANNING / CALENDRIER -->
    <section id="view-calendar" class="space-y-4 fade-in">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
        <div class="flex items-center gap-2">
          <button onclick="changeWeek(-1)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button onclick="goToToday()" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-sm font-medium rounded-lg transition-colors">
            Aujourd'hui
          </button>
          <button onclick="changeWeek(1)" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <span id="current-week-title" class="text-lg font-bold ml-2"></span>
        </div>

        <div class="flex items-center gap-3">
          <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700 p-1 bg-slate-50 dark:bg-slate-900">
            <button onclick="setCalendarMode('week')" id="mode-week-btn" class="px-3 py-1 text-xs font-semibold rounded-md bg-white dark:bg-slate-800 shadow-sm">
              Semaine
            </button>
            <button onclick="setCalendarMode('month')" id="mode-month-btn" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white">
              Mois
            </button>
          </div>
          <button onclick="openModalForNewEvent()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg shadow-sm transition-colors flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Événement
          </button>
        </div>
      </div>

      <div id="preset-buttons-bar" class="flex flex-wrap gap-2 py-1"></div>

      <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden">
        <div id="calendar-grid-header" class="grid grid-cols-8 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-center text-xs font-semibold uppercase text-slate-500 py-3"></div>
        <div id="calendar-grid-body" class="divide-y divide-slate-200 dark:divide-slate-700 max-h-[600px] overflow-y-auto custom-scrollbar"></div>
      </div>
    </section>

    <!-- VUE MENUS DU MOIS -->
    <section id="view-menu" class="hidden space-y-4 fade-in">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex justify-between items-center">
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-utensils text-indigo-500"></i> Planification des repas
        </h2>
        <span id="menu-month-title" class="font-semibold text-slate-500"></span>
      </div>
      <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </section>

    <!-- VUE LISTE DE COURSES -->
    <section id="view-shopping" class="hidden space-y-4 fade-in">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm max-w-2xl mx-auto space-y-4">
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-indigo-500"></i> Liste de courses
        </h2>
        <form onsubmit="addShoppingItem(event)" class="flex gap-2">
          <input type="text" id="shopping-input" placeholder="Ajouter un article..." class="flex-1 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
            Ajouter
          </button>
        </form>
        <ul id="shopping-list" class="divide-y divide-slate-200 dark:divide-slate-700"></ul>
      </div>
    </section>

    <!-- VUE TÂCHES -->
    <section id="view-tasks" class="hidden space-y-4 fade-in">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm max-w-2xl mx-auto space-y-4">
        <h2 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-list-check text-indigo-500"></i> Liste de tâches
        </h2>
        <form onsubmit="addTaskItem(event)" class="flex gap-2">
          <input type="text" id="task-input" placeholder="Nouvelle tâche..." class="flex-1 px-4 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors">
            Ajouter
          </button>
        </form>
        <ul id="tasks-list" class="divide-y divide-slate-200 dark:divide-slate-700"></ul>
      </div>
    </section>

  </main>

  <!-- MODAL ÉVÉNEMENT -->
  <div id="event-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 max-w-md w-full p-6 space-y-4 fade-in">
      <div class="flex justify-between items-center">
        <h3 id="modal-title" class="text-lg font-bold">Événement</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <input type="hidden" id="event-id">

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Titre</label>
          <input type="text" id="event-title-input" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Date</label>
          <input type="date" id="event-date-input" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="event-allday-input" onchange="toggleAllDayFields()" class="rounded text-indigo-600 focus:ring-indigo-500">
          <label for="event-allday-input" class="text-sm font-medium">Journée entière</label>
        </div>

        <div id="time-fields" class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Début</label>
            <input type="time" id="event-start-input" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Fin</label>
            <input type="time" id="event-end-input" class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent">
          </div>
        </div>

        <!-- RECURRENCE ROULANTE -->
        <div class="border-t border-slate-200 dark:border-slate-700 pt-3 space-y-2">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="recurrence-enable" onchange="toggleRecurrenceFields()" class="rounded text-indigo-600 focus:ring-indigo-500">
            <label for="recurrence-enable" class="text-sm font-semibold">Répétition / Roulement</label>
          </div>

          <div id="recurrence-fields" class="hidden space-y-2 pl-6 text-sm">
            <div class="flex items-center gap-2">
              <span>Durée :</span>
              <input type="number" id="event-span-days" value="1" min="1" max="14" class="w-16 px-2 py-1 border rounded text-center dark:bg-slate-700">
              <span>jour(s) consécutif(s)</span>
            </div>
            <div class="flex items-center gap-2">
              <span>Tous les :</span>
              <input type="number" id="recurrence-interval" value="14" min="1" class="w-16 px-2 py-1 border rounded text-center dark:bg-slate-700">
              <span>jours</span>
            </div>
            <div class="flex items-center gap-2">
              <span>Répéter :</span>
              <input type="number" id="recurrence-count" value="6" min="1" max="52" class="w-16 px-2 py-1 border rounded text-center dark:bg-slate-700">
              <span>fois</span>
            </div>
          </div>
        </div>

        <!-- COULEUR -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Couleur</label>
          <div class="flex items-center gap-2" id="color-picker-options">
            <button type="button" onclick="selectColor('bg-indigo-600 border-indigo-700')" class="w-6 h-6 rounded-full bg-indigo-600 ring-2 ring-offset-1 ring-indigo-600"></button>
            <button type="button" onclick="selectColor('bg-emerald-600 border-emerald-700')" class="w-6 h-6 rounded-full bg-emerald-600"></button>
            <button type="button" onclick="selectColor('bg-amber-600 border-amber-700')" class="w-6 h-6 rounded-full bg-amber-600"></button>
            <button type="button" onclick="selectColor('bg-rose-600 border-rose-700')" class="w-6 h-6 rounded-full bg-rose-600"></button>
            <button type="button" onclick="selectColor('bg-sky-600 border-sky-700')" class="w-6 h-6 rounded-full bg-sky-600"></button>
          </div>
          <input type="hidden" id="event-color-input" value="bg-indigo-600 border-indigo-700">
        </div>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-200 dark:border-slate-700">
        <button id="btn-delete" onclick="deleteCurrentEvent()" type="button" class="px-3 py-1.5 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/50 rounded-lg text-sm font-medium transition-colors hidden">
          Supprimer
        </button>
        <div class="flex gap-2 ml-auto">
          <button onclick="closeModal()" type="button" class="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700">
            Annuler
          </button>
          <button onclick="saveEvent()" type="button" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium shadow-sm">
            Enregistrer
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    // --- ÉTAT GLOBAL ---
    let currentDate = new Date();
    let currentView = 'calendar';
    let calendarMode = 'week'; // 'week' ou 'month'
    let events = JSON.parse(localStorage.getItem('fw_week_events')) || [];
    let shoppingList = JSON.parse(localStorage.getItem('fw_shopping_list')) || [];
    let tasksList = JSON.parse(localStorage.getItem('fw_tasks_list')) || [];
    let menuList = JSON.parse(localStorage.getItem('fw_menu_list')) || {};

    const PRESETS = [
      { label: 'Garde 24h', color: 'bg-rose-600 border-rose-700', start: '07:00', end: '07:00', span: 1 },
      { label: 'Garde Jour (12h)', color: 'bg-amber-600 border-amber-700', start: '07:00', end: '19:00', span: 1 },
      { label: 'Garde Nuit (12h)', color: 'bg-indigo-600 border-indigo-700', start: '19:00', end: '07:00', span: 1 },
      { label: 'Repos', color: 'bg-emerald-600 border-emerald-700', allDay: true, span: 1 }
    ];

    // --- AUTOMATISATION ET HEURES (MODE NUIT AUTOMATIQUE) ---
    function applyDarkMode() {
      const hour = new Date().getHours();
      const isNight = hour >= 21 || hour < 6;
      if (isNight) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    // --- NAVIGATION ET VUES ---
    function switchView(view) {
      currentView = view;
      ['dashboard', 'calendar', 'menu', 'shopping', 'tasks'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        const nav = document.getElementById(`nav-${v}`);
        if (v === view) {
          el.classList.remove('hidden');
          nav.className = "px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 flex items-center gap-2";
        } else {
          el.classList.add('hidden');
          nav.className = "px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-white flex items-center gap-2";
        }
      });

      if (view === 'dashboard') loadDashboardData();
      if (view === 'calendar') render();
      if (view === 'menu') renderMenuList();
    }

    function setCalendarMode(mode) {
      calendarMode = mode;
      document.getElementById('mode-week-btn').className = mode === 'week' ? 'px-3 py-1 text-xs font-semibold rounded-md bg-white dark:bg-slate-800 shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white';
      document.getElementById('mode-month-btn').className = mode === 'month' ? 'px-3 py-1 text-xs font-semibold rounded-md bg-white dark:bg-slate-800 shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 dark:hover:text-white';
      render();
    }

    // --- GESTION DES DATES ---
    function getStartOfWeek(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDateISO(d) {
      return d.toISOString().split('T')[0];
    }

    function changeWeek(offset) {
      if (calendarMode === 'week') {
        currentDate.setDate(currentDate.getDate() + (offset * 7));
      } else {
        currentDate.setMonth(currentDate.getMonth() + offset);
      }
      render();
    }

    function goToToday() {
      currentDate = new Date();
      render();
    }

    // --- DASHBOARD ---
    function loadDashboardData() {
      const todayStr = formatDateISO(new Date());
      const todayEvents = events.filter(e => e.date === todayStr);
      document.getElementById('dash-today-events').textContent = `${todayEvents.length} événement(s)`;

      const pendingTasks = tasksList.filter(t => !t.done).length;
      document.getElementById('dash-pending-tasks').textContent = `${pendingTasks} restante(s)`;

      const pendingShopping = shoppingList.filter(s => !s.done).length;
      document.getElementById('dash-shopping-count').textContent = `${pendingShopping} article(s)`;

      // Prochains événements
      const upcomingContainer = document.getElementById('dash-upcoming-list');
      upcomingContainer.innerHTML = '';
      const sorted = [...events].sort((a,b) => a.date.localeCompare(b.date)).filter(e => e.date >= todayStr).slice(0, 5);

      if(sorted.length === 0) {
        upcomingContainer.innerHTML = `<p class="text-slate-400 text-sm">Aucun événement prévu.</p>`;
      } else {
        sorted.forEach(e => {
          upcomingContainer.innerHTML += `
            <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg border-l-4 ${e.color || 'border-indigo-500'}">
              <div>
                <p class="font-bold text-sm">${e.title}</p>
                <p class="text-xs text-slate-500">${e.date} ${e.allDay ? '(Journée entière)' : (e.start + ' - ' + e.end)}</p>
              </div>
            </div>
          `;
        });
      }

      // Repas du jour
      const todayMealContainer = document.getElementById('dash-today-meals');
      const todayMeal = menuList[todayStr] || { midi: '', soir: '' };
      todayMealContainer.innerHTML = `
        <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg space-y-1">
          <p class="text-xs font-semibold uppercase text-indigo-500">Midi</p>
          <p class="text-sm font-medium">${todayMeal.midi || 'Non planifié'}</p>
        </div>
        <div class="p-3 bg-slate-50 dark:bg-slate-700/50 rounded-lg space-y-1">
          <p class="text-xs font-semibold uppercase text-indigo-500">Soir</p>
          <p class="text-sm font-medium">${todayMeal.soir || 'Non planifié'}</p>
        </div>
      `;
    }

    // --- PLANNER / CALENDRIER ---
    function render() {
      if (calendarMode === 'week') {
        renderWeekView();
      } else {
        renderMonthView();
      }
    }

    function renderWeekView() {
      const startOfWeek = getStartOfWeek(currentDate);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek);
        d.setDate(d.getDate() + i);
        days.push(d);
      }

      // Titre de la semaine
      const endOfWeek = days[6];
      document.getElementById('current-week-title').textContent = 
        `${startOfWeek.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} - ${endOfWeek.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })}`;

      // En-tête du tableau
      const header = document.getElementById('calendar-grid-header');
      header.innerHTML = `<div class="py-1">Heure</div>`;
      days.forEach(d => {
        const isToday = formatDateISO(d) === formatDateISO(new Date());
        header.innerHTML += `
          <div class="py-1 ${isToday ? 'text-indigo-600 dark:text-indigo-400 font-bold' : ''}">
            ${d.toLocaleDateString('fr-FR', { weekday: 'short' })}<br>
            <span class="text-sm">${d.getDate()}</span>
          </div>
        `;
      });

      // Corps du tableau (00h - 23h)
      const body = document.getElementById('calendar-grid-body');
      body.innerHTML = '';

      for (let hour = 0; hour < 24; hour++) {
        const hourStr = `${String(hour).padStart(2, '0')}:00`;
        let rowHtml = `<div class="grid grid-cols-8 min-h-[48px] border-b border-slate-100 dark:border-slate-800">
          <div class="text-[10px] text-slate-400 p-1 text-center border-r border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/30 font-mono">${hourStr}</div>`;

        days.forEach(d => {
          const dateStr = formatDateISO(d);
          const cellEvents = events.filter(e => {
            if (e.date !== dateStr) return false;
            if (e.allDay) return hour === 0;
            if (!e.start) return false;
            const startHour = parseInt(e.start.split(':')[0]);
            return startHour === hour;
          });

          rowHtml += `
            <div onclick="openModalForDateAndHour('${dateStr}', '${hourStr}')" class="p-1 border-r border-slate-200 dark:border-slate-700 hover:bg-indigo-50/30 dark:hover:bg-indigo-950/20 cursor-pointer transition-colors relative">
          `;

          cellEvents.forEach(e => {
            rowHtml += `
              <div onclick="event.stopPropagation(); editEvent(${e.id})" class="text-xs p-1.5 rounded text-white font-medium ${e.color || 'bg-indigo-600'} shadow-sm mb-1 truncate">
                ${e.title}
              </div>
            `;
          });

          rowHtml += `</div>`;
        });

        rowHtml += `</div>`;
        body.innerHTML += rowHtml;
      }
    }

    function renderMonthView() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      document.getElementById('current-week-title').textContent = 
        firstDay.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

      const header = document.getElementById('calendar-grid-header');
      header.innerHTML = `
        <div class="col-span-8 grid grid-cols-7 w-full">
          <div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div>
        </div>
      `;

      const body = document.getElementById('calendar-grid-body');
      body.innerHTML = '';

      let gridHtml = `<div class="grid grid-cols-7 auto-rows-fr min-h-[500px]">`;

      let startOffset = firstDay.getDay() - 1;
      if (startOffset === -1) startOffset = 6;

      for (let i = 0; i < startOffset; i++) {
        gridHtml += `<div class="bg-slate-50/50 dark:bg-slate-800/20 border-b border-r border-slate-200 dark:border-slate-700 min-h-[80px]"></div>`;
      }

      for (let day = 1; day <= lastDay.getDate(); day++) {
        const d = new Date(year, month, day);
        const dateStr = formatDateISO(d);
        const dayEvents = events.filter(e => e.date === dateStr);
        const isToday = dateStr === formatDateISO(new Date());

        gridHtml += `
          <div onclick="openModalForDateAndHour('${dateStr}', '08:00')" class="p-1 border-b border-r border-slate-200 dark:border-slate-700 min-h-[80px] hover:bg-slate-50 dark:hover:bg-slate-700/30 cursor-pointer">
            <div class="text-right text-xs font-semibold ${isToday ? 'text-indigo-600 dark:text-indigo-400 font-bold' : 'text-slate-400'}">${day}</div>
            <div class="space-y-1 mt-1">
        `;

        dayEvents.forEach(e => {
          gridHtml += `
            <div onclick="event.stopPropagation(); editEvent(${e.id})" class="text-[10px] p-1 rounded text-white truncate ${e.color || 'bg-indigo-600'}">
              ${e.title}
            </div>
          `;
        });

        gridHtml += `</div></div>`;
      }

      gridHtml += `</div>`;
      body.innerHTML = gridHtml;
    }

    // --- PRESETS ---
    function renderPresets() {
      const container = document.getElementById('preset-buttons-bar');
      container.innerHTML = `<span class="text-xs font-semibold text-slate-400 uppercase flex items-center mr-2">Accès rapide :</span>`;
      PRESETS.forEach(p => {
        container.innerHTML += `
          <button onclick="applyPreset('${p.label}', '${p.color}', '${p.start || ''}', '${p.end || ''}', ${p.allDay || false}, ${p.span})" class="px-2.5 py-1 text-xs font-medium text-white rounded-md ${p.color} shadow-sm hover:opacity-90 transition-opacity">
            + ${p.label}
          </button>
        `;
      });
    }

    function applyPreset(label, color, start, end, allDay, span) {
      openModalForNewEvent();
      document.getElementById('event-title-input').value = label;
      document.getElementById('event-start-input').value = start || "08:00";
      document.getElementById('event-end-input').value = end || "18:00";
      document.getElementById('event-allday-input').checked = allDay;
      document.getElementById('event-span-days').value = span || 1;
      selectColor(color);
      toggleAllDayFields();
    }

    // --- LISTE DE COURSES ---
    function renderShoppingList() {
      const ul = document.getElementById('shopping-list');
      ul.innerHTML = '';
      shoppingList.forEach((item, idx) => {
        ul.innerHTML += `
          <li class="py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleShoppingItem(${idx})" class="rounded text-indigo-600 focus:ring-indigo-500 h-5 w-5">
              <span class="${item.done ? 'line-through text-slate-400' : 'font-medium'}">${item.text}</span>
            </div>
            <button onclick="deleteShoppingItem(${idx})" class="text-slate-400 hover:text-rose-500">
              <i class="fa-solid fa-trash"></i>
            </button>
          </li>
        `;
      });
    }

    function addShoppingItem(e) {
      e.preventDefault();
      const input = document.getElementById('shopping-input');
      if (!input.value.trim()) return;
      shoppingList.push({ text: input.value.trim(), done: false });
      localStorage.setItem('fw_shopping_list', JSON.stringify(shoppingList));
      input.value = '';
      renderShoppingList();
    }

    function toggleShoppingItem(idx) {
      shoppingList[idx].done = !shoppingList[idx].done;
      localStorage.setItem('fw_shopping_list', JSON.stringify(shoppingList));
      renderShoppingList();
    }

    function deleteShoppingItem(idx) {
      shoppingList.splice(idx, 1);
      localStorage.setItem('fw_shopping_list', JSON.stringify(shoppingList));
      renderShoppingList();
    }

    // --- LISTE DE TÂCHES ---
    function renderTasksList() {
      const ul = document.getElementById('tasks-list');
      ul.innerHTML = '';
      tasksList.forEach((item, idx) => {
        ul.innerHTML += `
          <li class="py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleTaskItem(${idx})" class="rounded text-indigo-600 focus:ring-indigo-500 h-5 w-5">
              <span class="${item.done ? 'line-through text-slate-400' : 'font-medium'}">${item.text}</span>
            </div>
            <button onclick="deleteTaskItem(${idx})" class="text-slate-400 hover:text-rose-500">
              <i class="fa-solid fa-trash"></i>
            </button>
          </li>
        `;
      });
    }

    function addTaskItem(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      if (!input.value.trim()) return;
      tasksList.push({ text: input.value.trim(), done: false });
      localStorage.setItem('fw_tasks_list', JSON.stringify(tasksList));
      input.value = '';
      renderTasksList();
    }

    function toggleTaskItem(idx) {
      tasksList[idx].done = !tasksList[idx].done;
      localStorage.setItem('fw_tasks_list', JSON.stringify(tasksList));
      renderTasksList();
    }

    function deleteTaskItem(idx) {
      tasksList.splice(idx, 1);
      localStorage.setItem('fw_tasks_list', JSON.stringify(tasksList));
      renderTasksList();
    }

    // --- MENUS DU MOIS ---
    function renderMenuList() {
      const container = document.getElementById('menu-grid');
      container.innerHTML = '';

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      document.getElementById('menu-month-title').textContent = 
        new Date(year, month, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const dateStr = formatDateISO(d);
        const meal = menuList[dateStr] || { midi: '', soir: '' };

        container.innerHTML += `
          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">
            <div class="font-bold text-sm text-indigo-600 dark:text-indigo-400 border-b border-slate-100 dark:border-slate-700 pb-1">
              ${d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })}
            </div>
            <div>
              <label class="text-[10px] uppercase font-semibold text-slate-400 block">Midi</label>
              <input type="text" value="${meal.midi}" onchange="saveMenu('${dateStr}', 'midi', this.value)" class="w-full text-xs px-2 py-1 rounded border border-slate-200 dark:border-slate-600 bg-transparent focus:ring-1 focus:ring-indigo-500">
            </div>
            <div>
              <label class="text-[10px] uppercase font-semibold text-slate-400 block">Soir</label>
              <input type="text" value="${meal.soir}" onchange="saveMenu('${dateStr}', 'soir', this.value)" class="w-full text-xs px-2 py-1 rounded border border-slate-200 dark:border-slate-600 bg-transparent focus:ring-1 focus:ring-indigo-500">
            </div>
          </div>
        `;
      }
    }

    function saveMenu(dateStr, type, value) {
      if (!menuList[dateStr]) menuList[dateStr] = { midi: '', soir: '' };
      menuList[dateStr][type] = value;
      localStorage.setItem('fw_menu_list', JSON.stringify(menuList));
    }

    // --- MODAL & FORMULAIRE ---
    function selectColor(colorClass) {
      document.getElementById('event-color-input').value = colorClass;
    }

    function toggleAllDayFields() {
      const isAllDay = document.getElementById('event-allday-input').checked;
      const timeFields = document.getElementById('time-fields');
      if (isAllDay) {
        timeFields.classList.add('hidden');
      } else {
        timeFields.classList.remove('hidden');
      }
    }

    function toggleRecurrenceFields() {
      const isRecurrent = document.getElementById('recurrence-enable').checked;
      const fields = document.getElementById('recurrence-fields');
      if (isRecurrent) {
        fields.classList.remove('hidden');
      } else {
        fields.classList.add('hidden');
      }
    }

    function openModalForNewEvent() {
      openModalForDateAndHour(formatDateISO(new Date()), "08:00");
    }

    function openModalForDateAndHour(dateStr, hourStr) {
      document.getElementById('modal-title').textContent = "Nouvel événement";
      document.getElementById('event-id').value = "";
      document.getElementById('event-title-input').value = "";
      document.getElementById('event-date-input').value = dateStr;
      document.getElementById('event-start-input').value = hourStr;

      const [h] = hourStr.split(':').map(Number);
      const endH = String(Math.min(h + 1, 23)).padStart(2, '0');
      document.getElementById('event-end-input').value = `${endH}:00`;

      document.getElementById('event-allday-input').checked = false;
      toggleAllDayFields();

      document.getElementById('recurrence-enable').checked = false;
      toggleRecurrenceFields();

      document.getElementById('btn-delete').classList.add('hidden');
      selectColor('bg-indigo-600 border-indigo-700');
      renderPresets();

      document.getElementById('event-modal').classList.remove('hidden');
      document.getElementById('event-modal').classList.add('flex');
    }

    function editEvent(id) {
      const event = events.find(e => e.id === id);
      if (!event) return;

      document.getElementById('modal-title').textContent = "Modifier l'événement";
      document.getElementById('event-id').value = event.id;
      document.getElementById('event-title-input').value = event.title;
      document.getElementById('event-date-input').value = event.date;
      document.getElementById('event-start-input').value = event.start || "08:00";
      document.getElementById('event-end-input').value = event.end || "18:00";
      
      const isAllDay = !!event.allDay;
      document.getElementById('event-allday-input').checked = isAllDay;
      toggleAllDayFields();

      document.getElementById('recurrence-enable').checked = false;
      toggleRecurrenceFields();

      document.getElementById('btn-delete').classList.remove('hidden');
      selectColor(event.color || 'bg-indigo-600 border-indigo-700');
      renderPresets();

      document.getElementById('event-modal').classList.remove('hidden');
      document.getElementById('event-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('event-modal').classList.add('hidden');
      document.getElementById('event-modal').classList.remove('flex');
    }

    function saveEvent() {
      const id = document.getElementById('event-id').value;
      const title = document.getElementById('event-title-input').value.trim();
      const date = document.getElementById('event-date-input').value;
      const start = document.getElementById('event-start-input').value;
      const end = document.getElementById('event-end-input').value;
      const allDay = document.getElementById('event-allday-input').checked;
      const color = document.getElementById('event-color-input').value;

      if (!title || !date) return alert("Veuillez renseigner au moins un titre et une date.");

      const isRecurrent = document.getElementById('recurrence-enable').checked;

      if (id) {
        // Mode modification
        events = events.map(e => e.id === Number(id) ? { id: Number(id), title, date, start, end, allDay, color } : e);
      } else if (isRecurrent) {
        // Mode création avec roulement
        const spanDays = parseInt(document.getElementById('event-span-days').value) || 1;
        const interval = parseInt(document.getElementById('recurrence-interval').value) || 14;
        const cycles = parseInt(document.getElementById('recurrence-count').value) || 1;

        const baseDate = new Date(date);

        for (let c = 0; c < cycles; c++) {
          for (let s = 0; s < spanDays; s++) {
            const currentRecDate = new Date(baseDate);
            currentRecDate.setDate(baseDate.getDate() + (c * interval) + s);

            events.push({
              id: Date.now() + Math.random(),
              title,
              date: formatDateISO(currentRecDate),
              start,
              end,
              allDay,
              color
            });
          }
        }
      } else {
        // Mode création simple
        events.push({ id: Date.now(), title, date, start, end, allDay, color });
      }

      localStorage.setItem('fw_week_events', JSON.stringify(events));
      closeModal();
      render();
      if (currentView === 'dashboard') loadDashboardData();
    }

    function deleteCurrentEvent() {
      const id = document.getElementById('event-id').value;
      if (id) {
        deleteEventDirect(Number(id));
        closeModal();
      }
    }

    function deleteEventDirect(id) {
      events = events.filter(e => e.id !== id);
      localStorage.setItem('fw_week_events', JSON.stringify(events));
      render();
      if (currentView === 'dashboard') loadDashboardData();
    }

    // --- INITIALISATION AU CHARGEMENT ---
    window.addEventListener('DOMContentLoaded', () => {
      applyDarkMode();
      setInterval(applyDarkMode, 60000); // Vérification automatique du mode nuit chaque minute

      // Synchronisation initiale
      renderPresets();
      loadDashboardData();
      renderShoppingList();
      renderTasksList();
      renderMenuList();
      render();
    });
  </script>
</body>
</html>
